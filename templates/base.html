{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>

    <!-- ==========================================
         BASIC HTML SETTINGS
    ========================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >


    <!-- ==========================================
         PAGE TITLE
    ========================================== -->

    <title>

        {% block title %}
            MediConnect
        {% endblock %}

    </title>


    <!-- ==========================================
         MODERN SERIF FONT
         Used for MediConnect brand
    ========================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap"
        rel="stylesheet"
    >


    <!-- ==========================================
         BOOTSTRAP
    ========================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- ==========================================
         BOOTSTRAP ICONS
    ========================================== -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <!-- ==========================================
         MEDICONNECT CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >


    <!-- ==========================================
         EXTRA CSS
    ========================================== -->

    {% block extra_css %}
    {% endblock %}

</head>


<body>


<!-- ==========================================
     NAVBAR
========================================== -->

<header class="mc-navbar">


    <!-- ==========================================
         MEDICONNECT BRAND
    ========================================== -->

    <a
        href="{% url 'dashboard' %}"
        class="mc-brand"
    >

        MediConnect

    </a>


    <!-- ==========================================
         RIGHT SIDE OF NAVBAR
    ========================================== -->

    <div class="mc-navbar-right">

        {% if user.is_authenticated %}


            <!-- ==========================================
                 LOGGED-IN USER
            ========================================== -->

            <span class="mc-user-name">

                <i class="bi bi-person-circle"></i>

                {{ user.name }}

            </span>


            <!-- ==========================================
                 LOGOUT
            ========================================== -->

            <a
                href="{% url 'logout' %}"
                class="mc-logout-btn"
            >

                <i class="bi bi-box-arrow-right"></i>

                Logout

            </a>


        {% endif %}

    </div>


</header>


<!-- ==========================================
     MAIN LAYOUT
========================================== -->

<div class="mc-layout">


    <!-- ==========================================
         MAIN CONTENT
    ========================================== -->

    <main class="mc-main">

        {% block content %}

        {% endblock %}

    </main>


</div>


<!-- ==========================================
     FOOTER
========================================== -->

<footer class="mc-footer">

    <p class="mb-0">

        © 2026 MediConnect.
        All rights reserved.

    </p>

</footer>


<!-- ==========================================
     EXTRA JAVASCRIPT
========================================== -->

{% block extra_js %}
{% endblock %}


<!-- ==========================================
     BOOTSTRAP JAVASCRIPT
========================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>


</body>

</html>
