<!DOCTYPE html>
<html>

<head>
    <title>MediConnect - Delete Availability</title>
</head>

<body>

    <!-- ==========================================
         DELETE AVAILABILITY
         ========================================== -->

    <h1>MediConnect</h1>

    <h2>Delete Availability</h2>

    <p>
        Are you sure you want to delete this availability?
    </p>

    <p>
        {{ availability.get_day_display }}
        :
        {{ availability.start_time }}
        -
        {{ availability.end_time }}
    </p>

    <!-- ==========================================
         DELETE FORM
         ========================================== -->

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Yes, Delete
        </button>

    </form>

    <br>

    <a href="{% url 'doctor_availability' %}">
        Cancel
    </a>

</body>

</html>
