<!DOCTYPE html>
<html>

<head>

    <title>MediConnect - Doctor Profile</title>

</head>

<body>

    <!-- ==========================================
         DOCTOR PROFILE
         ========================================== -->

    <h1>MediConnect</h1>

    <h2>Doctor Profile</h2>

    <p>
        Welcome, Dr. {{ user.name }}
    </p>


    <!-- ==========================================
         PROFILE FORM
         ========================================== -->

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Save Profile
        </button>

    </form>


    <br>

    <a href="{% url 'doctor_dashboard' %}">
        Back to Dashboard
    </a>

    <br><br>

    <a href="{% url 'logout' %}">
        Logout
    </a>

</body>

</html>
